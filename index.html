<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLEビーコン位置マッピング</title>

<!-- 外部依存は Leaflet と OSMタイルのみ（設計 原則3）。CDN1本で完結 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<style>
  /* ===== デザイントークン（色）===== 設計 3節の色トークン */
  :root{
    --bg:#12151c; --panel:#1a1f2a; --panel2:#222836; --line:#2c3444;
    --text:#e7ecf3; --muted:#9aa6b8;
    --ok:#35c98a;     /* 受信中 */
    --accent:#3ea6ff; /* 推定現在地・主ボタン */
    --warn:#f5a524;   /* デモ・未登録・警告 */
    --bad:#ff5c5c;    /* 停止 */
    --idle:#4a5160;   /* 登録済みだが未受信 */
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Meiryo UI","Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  /* ===== ヘッダー ===== */
  header{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px; margin:0; margin-right:auto; font-weight:700}
  .badge{
    font-size:11px; padding:3px 8px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel2); color:var(--muted); white-space:nowrap;
  }
  .badge.ok{color:#0c1a12; background:var(--ok); border-color:var(--ok)}
  .badge.warn{color:#241a04; background:var(--warn); border-color:var(--warn)}
  .badge.bad{color:#2a0d0d; background:var(--bad); border-color:var(--bad)}

  /* ===== 地図 ===== */
  #mapWrap{position:relative; height:42dvh; min-height:220px; flex:0 0 auto}
  #map{width:100%; height:100%; background:#0c0e13}
  /* 推定現在地パネル（地図上にオーバーレイ）*/
  #hint{
    position:absolute; left:8px; bottom:8px; z-index:500; display:none;
    background:rgba(26,31,42,.92); border:1px solid var(--accent); border-radius:var(--radius);
    padding:8px 12px; max-width:70%; backdrop-filter:blur(4px);
  }
  #hint.show{display:block}
  #hintName{font-weight:700; color:var(--accent)}
  #hintSub{font-size:12px; color:var(--muted)}

  /* ===== タブ ===== */
  nav{display:flex; background:var(--panel); border-bottom:1px solid var(--line)}
  nav button{
    flex:1; padding:10px; background:none; border:none; color:var(--muted);
    font:inherit; cursor:pointer; border-bottom:2px solid transparent;
  }
  nav button.active{color:var(--text); border-bottom-color:var(--accent)}

  main{flex:1 1 auto; overflow:auto; padding:12px; -webkit-overflow-scrolling:touch}
  .pane{display:none}
  .pane.active{display:block}

  /* ===== 操作ボタン ===== */
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
  button.btn{
    padding:9px 14px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font:inherit; cursor:pointer;
  }
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:700}
  button.btn.warn{background:var(--warn); border-color:var(--warn); color:#241a04; font-weight:700}
  button.btn.bad{background:var(--bad); border-color:var(--bad); color:#2a0d0d; font-weight:700}
  button.btn.ghost{background:none}
  button.btn:disabled{opacity:.4; cursor:not-allowed}

  /* ===== 環境警告 ===== */
  #envNote{
    background:var(--panel); border:1px solid var(--warn); border-left-width:4px;
    border-radius:var(--radius); padding:8px 12px; margin-bottom:12px; font-size:12.5px; color:var(--muted);
  }
  #envNote ul{margin:6px 0 0; padding-left:18px}
  #envNote li{margin:2px 0}
  #envNote.hidden{display:none}

  /* ===== リスト ===== */
  .list{display:flex; flex-direction:column; gap:8px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px;
  }
  .card .top{display:flex; align-items:center; gap:8px}
  .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto}
  .card .name{font-weight:700}
  .card .sub{font-size:12px; color:var(--muted); margin-top:2px; word-break:break-all}
  .card .actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  .card .actions button{font-size:12px; padding:5px 10px}
  .tag{font-size:10.5px; padding:2px 6px; border-radius:6px; background:var(--panel2); color:var(--muted)}
  .tag.warn{background:var(--warn); color:#241a04}
  /* 電波強度バー */
  .bar{height:6px; border-radius:3px; background:var(--panel2); margin-top:8px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--ok); width:0}
  .empty{color:var(--muted); text-align:center; padding:24px 0}

  /* ===== フォーム ===== */
  .field{margin-bottom:10px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .field input{
    width:100%; padding:9px 10px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit;
  }
  .field input:focus{outline:none; border-color:var(--accent)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  h2.sec{font-size:13px; color:var(--muted); margin:18px 0 8px; font-weight:600}

  /* Leaflet のポップアップを暗色に馴染ませる */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2); color:var(--text)}
  .leaflet-popup-content{font-family:inherit; font-size:12.5px}

  /* ===== レーダー ===== */
  #radarWrap{position:relative; width:min(88vw,340px); aspect-ratio:1; margin:6px auto 14px}
  #radarSweep{
    position:absolute; inset:5%; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(62,166,255,.28), rgba(62,166,255,0) 70deg);
    animation:sweep 3.2s linear infinite; pointer-events:none;
  }
  @keyframes sweep{to{transform:rotate(360deg)}}
  #radarSvg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .radar-note{text-align:center; color:var(--muted); font-size:12px; margin:-4px 0 10px}
</style>
</head>
<body>

<header>
  <h1>BLEビーコン位置マッピング</h1>
  <span id="envBadge" class="badge">環境確認中…</span>
  <span id="scanBadge" class="badge">停止中</span>
</header>

<div id="mapWrap">
  <div id="map"></div>
  <div id="hint">
    <div id="hintName">—</div>
    <div id="hintSub">推定現在地</div>
  </div>
</div>

<nav>
  <button id="tabScan" class="active">スキャン</button>
  <button id="tabRadar">レーダー</button>
  <button id="tabReg">ビーコン登録</button>
</nav>

<main>
  <!-- ===== スキャンpane ===== -->
  <section id="paneScan" class="pane active">
    <div id="envNote" class="hidden"></div>
    <div class="row">
      <button id="btnScan" class="btn primary">スキャン開始</button>
      <button id="btnMock" class="btn warn">デモモード</button>
      <button id="btnFit" class="btn ghost">全体表示</button>
    </div>
    <div id="detList" class="list"></div>
  </section>

  <!-- ===== レーダーpane ===== 座標不要。登録ビーコンを距離で探す -->
  <section id="paneRadar" class="pane">
    <div class="row">
      <button id="btnScanR" class="btn primary">スキャン開始</button>
      <button id="btnMockR" class="btn warn">デモモード</button>
    </div>
    <div id="radarWrap">
      <div id="radarSweep"></div>
      <svg id="radarSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="radar-note">中心＝あなた／内側ほど近い（方向は電波では出せないため配置は固定）</div>
    <div id="radarList" class="list"></div>
  </section>

  <!-- ===== 登録pane ===== -->
  <section id="paneReg" class="pane">
    <h2 class="sec">ビーコンを登録 / 編集</h2>
    <div class="field">
      <label for="fName">名称</label>
      <input id="fName" type="text" placeholder="例：3F 会議室A 入口" autocomplete="off">
    </div>
    <div class="field">
      <label for="fUuid">UUID（8-4-4-4-12）</label>
      <input id="fUuid" type="text" placeholder="fda50693-a4e2-4fb1-afcf-c6eb07647825" autocomplete="off">
    </div>
    <div class="grid2">
      <div class="field">
        <label for="fMajor">Major（0〜65535）</label>
        <input id="fMajor" type="number" inputmode="numeric" placeholder="1">
      </div>
      <div class="field">
        <label for="fMinor">Minor（0〜65535）</label>
        <input id="fMinor" type="number" inputmode="numeric" placeholder="1">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="fLat">緯度 lat（任意 / -90〜90）</label>
        <input id="fLat" type="text" inputmode="decimal" placeholder="35.681236">
      </div>
      <div class="field">
        <label for="fLng">経度 lng（任意 / -180〜180）</label>
        <input id="fLng" type="text" inputmode="decimal" placeholder="139.767125">
      </div>
    </div>
    <div class="radar-note" style="text-align:left; margin:-2px 0 8px">
      ※ 緯度経度は<b>地図に置きたい時だけ</b>入力。レーダーで探すだけなら空欄でOK。
    </div>
    <div class="row">
      <button id="btnSave" class="btn primary">保存</button>
      <button id="btnGeo" class="btn">現在地を取得</button>
      <button id="btnPick" class="btn">地図で指定</button>
      <button id="btnClear" class="btn ghost">クリア</button>
    </div>
    <div class="row">
      <button id="btnExport" class="btn ghost">JSON書き出し</button>
      <button id="btnImport" class="btn ghost">JSON読み込み</button>
      <input id="fileImport" type="file" accept="application/json,.json" hidden>
    </div>

    <h2 class="sec">登録済みビーコン</h2>
    <div id="regList" class="list"></div>
  </section>
</main>

<!-- Leaflet 本体（CDN） -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script type="module">
/* =====================================================================
 * BLEビーコン位置マッピング（Phase1 / 単一ファイル実装）
 * 設計書「実装設計_BLEビーコン位置マッピング.md」に準拠。
 * セクションは設計書の module 順（const→store→ibeacon→state→sources→
 * mapview→ui→env→main）で区切る。単一ファイルだが BeaconSource の
 * 差し替え境界だけは崩さない（原則1）。
 * =================================================================== */

/* =========================== const ================================= */
const LS_KEY            = 'ble-beacon-map/v1'; // 構造変更時は末尾versionを上げる（=旧データ破棄扱い）
const EXPIRE_MS         = 12000;  // 最終受信からロスト判定まで
const RENDER_TICK_MS    = 600;    // 描画ループ間隔
const DEFAULT_TX_POWER  = -59;    // TxPower未取得時の1m基準RSSI
const PATH_LOSS_N       = 2;      // 伝搬損失係数（自由空間仮定）
const MAX_CIRCLE_M      = 60;     // 電波強度円の最大半径(m)
const MOCK_INTERVAL_MS  = 700;    // デモ疑似電波の間隔
const MAP_CENTER        = [35.6812, 139.7671]; // ★展示地の座標に差し替える
const MAP_ZOOM          = 17;
const MAP_MAX_ZOOM      = 19;     // OSMタイル提供上限
const COMPANY_ID_APPLE  = 0x004C; // iBeacon の Company ID
const RADAR_MAX_M       = 30;     // レーダーの外周が表す距離(m)。これ以遠は外周に張り付く
const RADAR_RINGS       = 3;      // 同心円の本数

// Leaflet はSVG属性へ直接色を書くため CSS変数が効かない。トークンと同値のhexを持つ
const COLOR = { ok:'#35c98a', accent:'#3ea6ff', warn:'#f5a524', bad:'#ff5c5c', idle:'#4a5160' };

// 座標を持つ（＝地図に置ける）ビーコンか。lat/lng が数値のときだけ true
function hasCoords(b){ return Number.isFinite(b.lat) && Number.isFinite(b.lng); }

/* =========================== store ================================= */
/* ビーコンマスタの CRUD と永続化 */
const store = (() => {
  let cache = [];

  function keyOf(uuid, major, minor){
    return `ibeacon:${String(uuid).toLowerCase()}:${major}:${minor}`;
  }
  function save(){
    // localStorage 上限超過などは呼び出し側へ通知（設計 8節 #9）
    localStorage.setItem(LS_KEY, JSON.stringify(cache));
  }
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)){
        console.warn('[store] 保存データが配列でない。空で開始します。');
        cache = []; return cache;
      }
      cache = arr; return cache;
    }catch(e){
      // 破損時は黙って[]にせず warn を残す（設計 5-1）
      console.warn('[store] 読み込み失敗。空で開始します:', e);
      cache = []; return cache;
    }
  }
  function all(){ return cache; }
  function get(key){ return cache.find(b => b.key === key); }
  function upsert(rec){
    const i = cache.findIndex(b => b.key === rec.key);
    if(i >= 0) cache[i] = rec;      // キー一致は上書き（新規追加しない）
    else cache.push(rec);
    save();
    return rec;
  }
  function remove(key){
    const i = cache.findIndex(b => b.key === key);
    if(i < 0) return false;
    cache.splice(i, 1); save();
    return true;
  }
  function toJSON(){ return JSON.stringify(cache, null, 2); }

  // インポートは任意文字列が入り得るため各件を検証。不正な件のみスキップ（設計 5-1）
  function importJSON(text){
    let arr;
    try{ arr = JSON.parse(text); }
    catch(e){ return { ok:0, err:'JSONの解析に失敗しました：' + e.message }; }
    if(!Array.isArray(arr)) return { ok:0, err:'配列形式ではありません。' };
    let ok = 0;
    for(const item of arr){
      const rec = normalizeBeacon(item);
      if(rec){ upsert(rec); ok++; }
    }
    return { ok, err:null };
  }

  return { keyOf, load, all, get, upsert, remove, toJSON, importJSON };
})();

// フォーム由来／インポート由来の生データを検証して正規化。不正なら null
function normalizeBeacon(o){
  if(!o || typeof o !== 'object') return null;
  const name = String(o.name ?? '').trim();
  const uuid = String(o.uuid ?? '').trim().toLowerCase();
  const major = Number(o.major);
  const minor = Number(o.minor);
  if(name.length < 1) return null;
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(uuid)) return null;
  if(!Number.isInteger(major) || major < 0 || major > 65535) return null;
  if(!Number.isInteger(minor) || minor < 0 || minor > 65535) return null;
  // 緯度経度は任意（レーダー専用なら座標なしで可）。片方でも欠けたら座標なし扱い
  const hasLat = o.lat !== null && o.lat !== undefined && o.lat !== '';
  const hasLng = o.lng !== null && o.lng !== undefined && o.lng !== '';
  let lat = null, lng = null;
  if(hasLat || hasLng){
    lat = Number(o.lat); lng = Number(o.lng);
    if(!Number.isFinite(lat) || lat < -90 || lat > 90) return null;
    if(!Number.isFinite(lng) || lng < -180 || lng > 180) return null;
  }
  return { key: store.keyOf(uuid, major, minor), name, uuid, major, minor, lat, lng };
}

/* =========================== ibeacon =============================== */
/* アドバタイズのパースと距離推定 */

// 8-4-4-4-12 のハイフン整形
function formatUuid(bytes){
  const hex = bytes.map(b => b.toString(16).padStart(2,'0')).join('');
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

// manufacturerData は Map<companyId, DataView>。
// 【重要】Web Bluetooth は Company ID を「キー」として渡すため、DataView に
// Company IDの2バイトは含まれない。ネイティブAPIで生バイトを扱う場合はオフセットが2ずれる（Phase2の事故点）
function parseIBeacon(manufacturerData){
  if(!manufacturerData) return null;
  const dv = manufacturerData.get(COMPANY_ID_APPLE);
  if(!dv) return null;
  if(dv.byteLength < 23) return null;      // 異常系
  if(dv.getUint8(0) !== 0x02) return null; // Type
  if(dv.getUint8(1) !== 0x15) return null; // Length(21)
  const uuidBytes = [];
  for(let i = 2; i <= 17; i++) uuidBytes.push(dv.getUint8(i));
  return {
    uuid: formatUuid(uuidBytes),
    major: dv.getUint16(18, false),  // ビッグエンディアン
    minor: dv.getUint16(20, false),
    txPower: dv.getInt8(22)          // 符号付き
  };
}

// 距離推定。txPower が 0 のとき falsy で既定値に落ちないよう ?? を使う（|| は不可）
function estimateDistance(rssi, txPower){
  const tx = (txPower ?? DEFAULT_TX_POWER);
  return Math.pow(10, (tx - rssi) / (10 * PATH_LOSS_N));
}

/* =========================== state ================================= */
/* 受信状態の保持。履歴は持たず、同一キーは上書き */
const state = (() => {
  const dets = new Map(); // key -> Detection

  function onEvent(ev){
    const key = store.keyOf(ev.uuid, ev.major, ev.minor);
    dets.set(key, {
      key, uuid:ev.uuid, major:ev.major, minor:ev.minor,
      txPower:ev.txPower, rssi:ev.rssi, lastSeen:Date.now()
    });
  }
  function sweep(now){
    let removed = 0;
    for(const [k,d] of dets){
      if(now - d.lastSeen > EXPIRE_MS){ dets.delete(k); removed++; }
    }
    return removed;
  }
  function active(){
    return [...dets.values()].sort((a,b) => b.rssi - a.rssi); // RSSI降順
  }
  // マスタに登録済みかつRSSI最強＝推定現在地。未登録は座標が無いので候補外
  function best(){
    for(const d of active()){
      const beacon = store.get(d.key);
      if(beacon) return { beacon, detection:d };
    }
    return null;
  }
  function clear(){ dets.clear(); }

  return { onEvent, sweep, active, best, clear };
})();

/* =========================== sources ==============================
 * ★差し替え境界。実装はダックタイピング：
 *   { name, isAvailable(), async start(onEvent), stop() }
 * ================================================================= */

// Web Bluetooth 実装
const WebBluetoothSource = {
  name: 'BLEスキャン',
  _scan: null,
  _listener: null,
  isAvailable(){
    return window.isSecureContext && !!(navigator.bluetooth && navigator.bluetooth.requestLEScan);
  },
  async start(onEvent){
    // リスナは start ごとに追加し、stop で必ず removeEventListener（多重登録防止）
    this._listener = (event) => {
      const parsed = parseIBeacon(event.manufacturerData);
      if(!parsed) return; // iBeacon以外は破棄
      onEvent({ ...parsed, rssi: event.rssi });
    };
    navigator.bluetooth.addEventListener('advertisementreceived', this._listener);
    // requestLEScan はユーザー操作のコールスタック内から呼ぶ必要がある（呼び出し側で担保）
    this._scan = await navigator.bluetooth.requestLEScan({
      acceptAllAdvertisements: true, keepRepeatedDevices: true
    });
  },
  stop(){
    if(this._listener){
      navigator.bluetooth.removeEventListener('advertisementreceived', this._listener);
      this._listener = null;
    }
    if(this._scan){
      try{ this._scan.stop(); }catch(e){ /* 既に停止済み */ }
      this._scan = null;
    }
  }
};

// デモ用の疑似電波実装。登録済みビーコンに対し疑似RSSIを生成
const MockSource = {
  name: 'デモモード',
  _timer: null,
  _t: 0,
  isAvailable(){ return true; },
  async start(onEvent){
    this._t = 0;
    this._timer = setInterval(() => {
      this._t += MOCK_INTERVAL_MS / 1000;
      store.all().forEach((b, i) => {
        const rssi = Math.round(-62 + 22 * Math.sin(this._t + i * 2.1) - Math.random() * 4);
        if(rssi > -95){ // 近接／離脱を再現
          onEvent({ uuid:b.uuid, major:b.major, minor:b.minor, txPower:DEFAULT_TX_POWER, rssi });
        }
      });
    }, MOCK_INTERVAL_MS);
  },
  stop(){
    if(this._timer){ clearInterval(this._timer); this._timer = null; }
  }
};

/* =========================== mapview =============================== */
/* Leaflet 描画。描画は「状態からの全再構築」（原則2）*/
const mapview = (() => {
  let map = null, layer = null, pickHandler = null;

  function init(elId){
    map = L.map(elId, { zoomControl:true }).setView(MAP_CENTER, MAP_ZOOM);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: MAP_MAX_ZOOM,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }

  function redraw(beacons, dets, best){
    layer.clearLayers(); // 全消去→全描画
    const detByKey = new Map(dets.map(d => [d.key, d]));

    beacons.forEach(b => {
      if(!hasCoords(b)) return; // 座標なし（レーダー専用）は地図に置けない
      const det = detByKey.get(b.key);
      const receiving = !!det;

      // 電波強度円（受信中のみ）
      if(receiving){
        const dist = estimateDistance(det.rssi, det.txPower);
        L.circle([b.lat, b.lng], {
          radius: Math.min(dist, MAX_CIRCLE_M),
          color: COLOR.ok, weight:1, fillColor:COLOR.ok, fillOpacity:0.08
        }).addTo(layer);
      }

      // 位置マーカー（全登録ビーコン）
      const color = receiving ? COLOR.ok : COLOR.idle;
      const dist = receiving ? estimateDistance(det.rssi, det.txPower).toFixed(1) + ' m' : '—';
      const rssi = receiving ? det.rssi + ' dBm' : '未受信';
      // name はユーザー入力＝ポップアップも esc 必須
      const html =
        `<b>${esc(b.name)}</b><br>` +
        `Major/Minor: ${esc(String(b.major))}/${esc(String(b.minor))}<br>` +
        `RSSI: ${esc(rssi)}<br>推定距離: ${esc(dist)}`;
      L.circleMarker([b.lat, b.lng], {
        radius:7, color, weight:2, fillColor:color, fillOpacity:1
      }).bindPopup(html).addTo(layer);
    });

    // 推定現在地リング
    if(best){
      L.circleMarker([best.beacon.lat, best.beacon.lng], {
        radius:16, color:COLOR.accent, weight:3, fill:false
      }).addTo(layer);
    }
  }

  function fitAll(beacons){
    const withCoords = beacons.filter(hasCoords);
    if(!withCoords.length) return;
    const bounds = L.latLngBounds(withCoords.map(b => [b.lat, b.lng]));
    map.fitBounds(bounds.pad(0.3));
  }
  function focus(beacon){ map.setView([beacon.lat, beacon.lng], 19); }

  // 座標指定モード。1回クリックで自動解除する
  function onPick(cb){
    if(pickHandler) map.off('click', pickHandler);
    pickHandler = (e) => {
      map.off('click', pickHandler); pickHandler = null;
      cb(e.latlng.lat, e.latlng.lng);
    };
    map.on('click', pickHandler);
  }

  return { init, redraw, fitAll, focus, onPick };
})();

/* =========================== radar ================================
 * 距離レーダー（座標不要）。登録済みかつ受信中のビーコンを、
 * 中心=自分 / 半径=推定距離 で光点表示。方向は電波では出せないため
 * 角度はキーから固定割当し、半径（距離）だけが動く。
 * ================================================================= */
const radar = (() => {
  const CX = 100, CY = 100, R = 88;

  // キーから安定した角度(度)を得る。受信のたびに光点が飛ばないよう固定
  function angleFor(key){
    let h = 0;
    for(const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return (h % 360) * Math.PI / 180;
  }
  const pct = (rssi) => Math.max(0, Math.min(100, Math.round((rssi + 95) / 55 * 100)));

  function redraw(beacons, dets){
    const svg = document.getElementById('radarSvg');
    if(!svg) return;
    const detByKey = new Map(dets.map(d => [d.key, d]));

    // 登録済みかつ受信中のビーコンを近い順に
    const blips = beacons
      .map(b => {
        const d = detByKey.get(b.key);
        return d ? { b, dist: estimateDistance(d.rssi, d.txPower), rssi: d.rssi } : null;
      })
      .filter(Boolean)
      .sort((a, b) => a.dist - b.dist);

    let s = '';
    // 同心円＋距離ラベル
    for(let i = 1; i <= RADAR_RINGS; i++){
      const rr = R * i / RADAR_RINGS;
      s += `<circle cx="${CX}" cy="${CY}" r="${rr.toFixed(1)}" fill="none" stroke="#2c3444" stroke-width="0.6"/>`;
      s += `<text x="${CX + 1.5}" y="${(CY - rr + 6).toFixed(1)}" fill="#5b6472" font-size="6">${Math.round(RADAR_MAX_M * i / RADAR_RINGS)}m</text>`;
    }
    // 十字＋中心（あなた）
    s += `<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY+R}" stroke="#2c3444" stroke-width="0.4"/>`;
    s += `<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}" stroke="#2c3444" stroke-width="0.4"/>`;
    s += `<circle cx="${CX}" cy="${CY}" r="3" fill="${COLOR.accent}"/>`;
    s += `<text x="${CX}" y="${CY+12}" fill="#9aa6b8" font-size="5.5" text-anchor="middle">あなた</text>`;

    // 光点
    blips.forEach((bl, idx) => {
      const a = angleFor(bl.b.key);
      const rr = R * Math.min(bl.dist, RADAR_MAX_M) / RADAR_MAX_M;
      const x = CX + rr * Math.cos(a), y = CY + rr * Math.sin(a);
      const closest = idx === 0;
      const col = closest ? COLOR.accent : COLOR.ok;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${closest ? 5 : 4}" fill="${col}" fill-opacity="0.9">`;
      if(closest) s += `<animate attributeName="r" values="5;7.5;5" dur="1.2s" repeatCount="indefinite"/>`;
      s += `</circle>`;
      s += `<text x="${x.toFixed(1)}" y="${(y-7).toFixed(1)}" fill="#e7ecf3" font-size="6" text-anchor="middle">${esc(bl.b.name)}</text>`;
      s += `<text x="${x.toFixed(1)}" y="${(y+11).toFixed(1)}" fill="#9aa6b8" font-size="5.5" text-anchor="middle">約${bl.dist.toFixed(1)}m</text>`;
    });
    svg.innerHTML = s;

    // 近い順リスト
    const box = document.getElementById('radarList');
    if(!blips.length){
      box.innerHTML = '<div class="empty">登録ビーコンを探索中…<br>「スキャン開始」を押してください</div>';
      return;
    }
    box.innerHTML = blips.map((bl, i) => `<div class="card">
      <div class="top">
        <span class="dot" style="background:${i===0?COLOR.accent:COLOR.ok}"></span>
        <span class="name">${esc(bl.b.name)}</span>
        ${i===0 ? '<span class="tag" style="background:var(--accent);color:#04121f">最も近い</span>' : ''}
      </div>
      <div class="sub">約${esc(bl.dist.toFixed(1))}m ／ RSSI ${esc(String(bl.rssi))}dBm</div>
      <div class="bar"><i style="width:${pct(bl.rssi)}%"></i></div>
    </div>`).join('');
  }

  return { redraw };
})();

/* =========================== ui ==================================== */
/* HTMLエスケープ（& < > "）。innerHTML へ流す全経路で通す */
function esc(s){
  return String(s)
    .replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;');
}
const $ = (id) => document.getElementById(id);

const ui = (() => {
  function showTab(name){
    for(const t of ['Scan','Radar','Reg']){
      const on = name === t.toLowerCase();
      $('tab'+t).classList.toggle('active', on);
      $('pane'+t).classList.toggle('active', on);
    }
  }

  // 受信一覧
  function renderDetList(dets){
    const box = $('detList');
    if(!dets.length){
      box.innerHTML = '<div class="empty">受信中のビーコンはありません</div>';
      return;
    }
    box.innerHTML = dets.map(d => {
      const beacon = store.get(d.key);
      const registered = !!beacon;
      const name = registered ? beacon.name : '（未登録ビーコン）';
      const dist = estimateDistance(d.rssi, d.txPower).toFixed(1);
      const pct = Math.max(0, Math.min(100, Math.round((d.rssi + 95) / 55 * 100))); // -95..-40 → 0..100
      const tag = registered ? '' : '<span class="tag warn">未登録</span>';
      const btn = registered ? '' :
        `<button class="btn" data-act="toReg" data-key="${esc(d.key)}">この値を登録画面へ</button>`;
      return `<div class="card">
        <div class="top"><span class="dot" style="background:${registered?COLOR.ok:COLOR.warn}"></span>
          <span class="name">${esc(name)}</span> ${tag}</div>
        <div class="sub">UUID:${esc(d.uuid)}<br>Major/Minor:${esc(String(d.major))}/${esc(String(d.minor))}
          ／ RSSI ${esc(String(d.rssi))}dBm ／ 約${esc(dist)}m</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${btn ? `<div class="actions">${btn}</div>` : ''}
      </div>`;
    }).join('');

    // イベントは生成後に付与
    box.querySelectorAll('[data-act="toReg"]').forEach(b => {
      b.addEventListener('click', () => {
        const d = state.active().find(x => x.key === b.dataset.key);
        if(!d) return;
        fillForm({ name:'', uuid:d.uuid, major:d.major, minor:d.minor, lat:'', lng:'' });
        showTab('reg');
        $('fName').focus();
      });
    });
  }

  // 登録一覧
  function renderRegList(beacons){
    const box = $('regList');
    if(!beacons.length){
      box.innerHTML = '<div class="empty">登録済みビーコンはありません</div>';
      return;
    }
    box.innerHTML = beacons.map(b => `<div class="card">
      <div class="top"><span class="dot" style="background:${COLOR.idle}"></span>
        <span class="name">${esc(b.name)}</span>
        ${hasCoords(b) ? '' : '<span class="tag">座標なし（レーダーのみ）</span>'}</div>
      <div class="sub">UUID:${esc(b.uuid)}<br>Major/Minor:${esc(String(b.major))}/${esc(String(b.minor))}
        ／ ${hasCoords(b) ? '緯度経度 '+esc(String(b.lat))+', '+esc(String(b.lng)) : '地図に置くには座標を登録'}</div>
      <div class="actions">
        <button class="btn" data-act="edit" data-key="${esc(b.key)}">編集</button>
        ${hasCoords(b) ? `<button class="btn" data-act="focus" data-key="${esc(b.key)}">地図で見る</button>` : ''}
        <button class="btn ghost" data-act="del" data-key="${esc(b.key)}">削除</button>
      </div>
    </div>`).join('');

    box.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', () => {
        const b = store.get(el.dataset.key);
        if(!b) return;
        const act = el.dataset.act;
        if(act === 'edit'){ fillForm(b); showTab('reg'); $('fName').focus(); }
        else if(act === 'focus'){ mapview.focus(b); }
        else if(act === 'del'){
          if(confirm(`「${b.name}」を削除しますか？`)){ store.remove(b.key); refreshLists(); }
        }
      });
    });
  }

  // フォーム値を読み、検証して返す（検証はここに集約。保存側では再検証しない）
  function readForm(){
    const name = $('fName').value.trim();
    const uuid = $('fUuid').value.trim().toLowerCase();
    const major = parseInt($('fMajor').value, 10);
    const minor = parseInt($('fMinor').value, 10);
    const latRaw = $('fLat').value.trim();
    const lngRaw = $('fLng').value.trim();

    if(name.length < 1) return { ok:false, msg:'名称を入力してください。' };
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(uuid))
      return { ok:false, msg:'UUIDの形式が正しくありません（8-4-4-4-12）。' };
    if(!Number.isInteger(major) || major < 0 || major > 65535)
      return { ok:false, msg:'Major は 0〜65535 の整数で入力してください。' };
    if(!Number.isInteger(minor) || minor < 0 || minor > 65535)
      return { ok:false, msg:'Minor は 0〜65535 の整数で入力してください。' };

    // 緯度経度は任意。両方空ならレーダー専用（座標なし）として保存
    let lat = null, lng = null;
    if(latRaw !== '' || lngRaw !== ''){
      if(latRaw === '' || lngRaw === '')
        return { ok:false, msg:'緯度と経度は両方入力するか、両方空にしてください（地図なしのレーダー専用は両方空）。' };
      lat = parseFloat(latRaw); lng = parseFloat(lngRaw);
      if(!Number.isFinite(lat) || lat < -90 || lat > 90)
        return { ok:false, msg:'緯度は -90〜90 の範囲で入力してください。' };
      if(!Number.isFinite(lng) || lng < -180 || lng > 180)
        return { ok:false, msg:'経度は -180〜180 の範囲で入力してください。' };
    }

    return { ok:true, rec:{ key:store.keyOf(uuid,major,minor), name, uuid, major, minor, lat, lng } };
  }

  function fillForm(o){
    $('fName').value  = o.name ?? '';
    $('fUuid').value  = o.uuid ?? '';
    $('fMajor').value = (o.major ?? '') === '' ? '' : o.major;
    $('fMinor').value = (o.minor ?? '') === '' ? '' : o.minor;
    $('fLat').value   = o.lat ?? '';
    $('fLng').value   = o.lng ?? '';
  }
  function clearForm(){ fillForm({ name:'',uuid:'',major:'',minor:'',lat:'',lng:'' }); }

  // ボタン文言・バッジ状態
  function setScanUI(on, label){
    const badge = $('scanBadge');
    // スキャン/レーダー両paneの開始ボタンを同期
    [['btnScan','btnMock'], ['btnScanR','btnMockR']].forEach(([scanId, mockId]) => {
      const scan = $(scanId), mock = $(mockId);
      if(!scan) return;
      if(on){
        scan.textContent = 'スキャン停止';
        scan.classList.remove('primary'); scan.classList.add('bad');
        if(mock) mock.disabled = true;
      }else{
        scan.textContent = 'スキャン開始';
        scan.classList.add('primary'); scan.classList.remove('bad');
        if(mock) mock.disabled = false;
      }
    });
    if(on){
      badge.textContent = label || '受信中';
      badge.className = 'badge ' + (label === 'デモモード' ? 'warn' : 'ok');
    }else{
      badge.textContent = '停止中';
      badge.className = 'badge';
    }
  }

  function setHint(best){
    const el = $('hint');
    if(best){
      el.classList.add('show');
      $('hintName').textContent = best.beacon.name;
      $('hintSub').textContent  = `推定現在地 ／ RSSI ${best.detection.rssi}dBm`;
    }else{
      el.classList.remove('show');
    }
  }

  return { showTab, renderDetList, renderRegList, readForm, fillForm, clearForm, setScanUI, setHint };
})();

/* =========================== env =================================== */
const env = (() => {
  function check(){
    const secure = window.isSecureContext;
    const hasBluetooth = !!navigator.bluetooth;
    const hasLEScan = !!(navigator.bluetooth && navigator.bluetooth.requestLEScan);
    return { secure, hasBluetooth, hasLEScan, ok: secure && hasBluetooth && hasLEScan };
  }
  function warnings(){
    const c = check();
    const w = [];
    if(!c.secure)
      w.push('https（または localhost）で開く必要があります。位置情報も使えません。');
    if(!c.hasBluetooth)
      w.push('このブラウザは Web Bluetooth 非対応です（iOS は仕様上不可）。Chrome for Android を使ってください。');
    else if(!c.hasLEScan)
      w.push('chrome://flags/#enable-experimental-web-platform-features を Enabled にして再起動してください。');
    if(c.ok)
      w.push('Bluetooth と「位置情報サービス」を両方ONにしてください。' +
             '端末の位置情報がOFFだと、開始しても一件も受信できません（無症状の空振り。空振り時の第一被疑箇所）。');
    return w;
  }
  return { check, warnings };
})();

/* =========================== main ================================== */
let currentSource = null; // 実機とデモは排他。同時稼働させない

function refreshLists(){
  ui.renderRegList(store.all());
  mapview.redraw(store.all(), state.active(), state.best());
}

// 地図の推定現在地は「登録済み＋座標あり＋最強」。座標なしは地図に置けないので除外
function bestForMap(dets){
  for(const d of dets){
    const b = store.get(d.key);
    if(b && hasCoords(b)) return { beacon:b, detection:d };
  }
  return null;
}

function tick(){
  state.sweep(Date.now());
  const dets = state.active();
  const beacons = store.all();
  const mapBest = bestForMap(dets);
  mapview.redraw(beacons, dets, mapBest);
  radar.redraw(beacons, dets);
  ui.renderDetList(dets);
  ui.setHint(mapBest);
}

async function startScan(source, label){
  if(currentSource) return; // 二重起動防止
  if(!source.isAvailable()){
    alert('この環境では利用できません。\n\n' + env.warnings().join('\n\n') + '\n\n（デモモードで動作確認できます）');
    return;
  }
  try{
    currentSource = source;
    await source.start(state.onEvent);
    ui.setScanUI(true, label);
  }catch(e){
    // BT OFF / 権限拒否 / http 等（設計 8節 #4）
    currentSource = null;
    ui.setScanUI(false);
    alert('開始できませんでした：' + (e && e.message ? e.message : e) +
      '\n\n考えられる原因：\n・Bluetooth が OFF\n・位置情報サービスが OFF\n・http で開いている');
  }
}

function stopScan(){
  if(currentSource){ currentSource.stop(); currentSource = null; }
  state.clear();
  ui.setScanUI(false);
  tick();
}

function bind(){
  // タブ
  $('tabScan').addEventListener('click', () => ui.showTab('scan'));
  $('tabRadar').addEventListener('click', () => ui.showTab('radar'));
  $('tabReg').addEventListener('click', () => ui.showTab('reg'));

  // スキャン操作（start はユーザー操作のコールスタック内で呼ぶ）
  const onScanClick = () => {
    if(currentSource) stopScan();
    else startScan(getRealSource(), '受信中');
  };
  const onMockClick = () => {
    if(currentSource) return;
    if(store.all().length === 0){ alert('先にビーコンを登録してください。'); ui.showTab('reg'); return; }
    startScan(MockSource, 'デモモード');
  };
  // スキャンpane / レーダーpane 両方の開始・デモボタンを同じ処理に接続
  $('btnScan').addEventListener('click', onScanClick);
  $('btnMock').addEventListener('click', onMockClick);
  $('btnScanR').addEventListener('click', onScanClick);
  $('btnMockR').addEventListener('click', onMockClick);
  $('btnFit').addEventListener('click', () => mapview.fitAll(store.all()));

  // 登録操作
  $('btnSave').addEventListener('click', () => {
    const r = ui.readForm();
    if(!r.ok){ alert(r.msg); return; }
    store.upsert(r.rec);
    ui.clearForm();
    refreshLists();
    alert('保存しました。');
  });
  $('btnGeo').addEventListener('click', () => {
    if(!navigator.geolocation){ alert('この環境では位置情報を取得できません。手入力／地図クリックで指定してください。'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { $('fLat').value = pos.coords.latitude.toFixed(6); $('fLng').value = pos.coords.longitude.toFixed(6); },
      (err) => { alert('現在地の取得に失敗しました：' + err.message + '\n手入力／地図クリックで代替できます。'); },
      { enableHighAccuracy:true, timeout:10000 }
    );
  });
  $('btnPick').addEventListener('click', () => {
    alert('地図上をタップして座標を指定してください（1回で解除）。');
    mapview.onPick((lat, lng) => { $('fLat').value = lat.toFixed(6); $('fLng').value = lng.toFixed(6); });
  });
  $('btnClear').addEventListener('click', () => ui.clearForm());

  // 入出力
  $('btnExport').addEventListener('click', () => {
    const blob = new Blob([store.toJSON()], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'beacons.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btnImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const res = store.importJSON(String(reader.result)); // 失敗しても既存データは変更しない
      if(res.err) alert('読み込みに失敗しました：' + res.err);
      else{ refreshLists(); alert(`${res.ok}件を読み込みました。`); }
    };
    reader.onerror = () => alert('ファイルの読み込みに失敗しました。');
    reader.readAsText(file);
    e.target.value = ''; // 同じファイルを連続選択できるように
  });

  // 画面離脱時はスキャンを止める（設計 6-4）
  window.addEventListener('pagehide', () => { if(currentSource) currentSource.stop(); });
}

/* --- 初期化 --- */
function boot(){
  store.load();
  mapview.init('map');
  bind();

  // 環境判定 → 警告表示
  const c = env.check();
  const badge = $('envBadge');
  badge.textContent = c.ok ? 'BLEスキャン利用可' : 'BLE利用不可（デモ可）';
  badge.className = 'badge ' + (c.ok ? 'ok' : 'warn');
  if(!c.ok) $('btnScan').disabled = false; // 押下時に原因を案内する方針（無効化はしない）
  const w = env.warnings();
  const note = $('envNote');
  if(w.length){
    note.classList.remove('hidden');
    note.innerHTML = '<b>環境メモ</b><ul>' + w.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>';
  }

  refreshLists();
  mapview.fitAll(store.all());
  setInterval(tick, RENDER_TICK_MS);
}

boot();
</script>
